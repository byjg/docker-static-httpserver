name: Docker

on:
  # schedule:
  #  - cron: '0 10 1 * *'
  push:
    branches: [ master ]
    # Publish semver tags as releases.
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ master ]

env:
  # github.repository as <account>/<repo>
  IMAGE_NAME: byjg/static-httpserver


jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The project has no dependencies, so there is no go.sum to key a
          # cache on; leaving it enabled fails the step.
          cache: false

      - name: Vet
        run: make lint

      - name: Test
        run: make test

  VersionCheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The check compares against the base branch or the previous tag.
          fetch-depth: 0

      # Gated on a pull request and on a tag, the two events that can publish
      # something carrying a version. Pushes to master and to feature branches
      # fall through and the job passes.
      #
      # The condition sits on the step rather than the job: a skipped job also
      # skips everything that needs it, which would take the whole build with it.
      - name: Check chart and app versions
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/check-version.sh pr "origin/${{ github.base_ref }}"
          else
            ./scripts/check-version.sh tag "${{ github.ref_name }}"
          fi

  Build:
    needs: [Test, VersionCheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The Makefile derives the version from `git describe`, which needs
          # the tags and the history behind them.
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request' || github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      #
      # master  -> :latest
      # v0.5.0  -> :0.5.0, :0.5 and :latest (the default `latest=auto` flavor
      #            moves `latest` onto every semver tag)
      # PR      -> :pr-N, built but not pushed
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # The build context has no .git, so `git describe` has to run here and be
      # handed to the image as a build argument.
      - name: Resolve the binary version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # - name: Docker Hub Description
      #   if: github.event_name != 'pull_request' || github.event.inputs.push == 'true'
      #   run: |
      #     wget -q  https://github.com/christian-korneck/docker-pushrm/releases/download/v1.8.0/docker-pushrm_linux_amd64 -O $HOME/.docker/cli-plugins/docker-pushrm
      #     chmod +x $HOME/.docker/cli-plugins/docker-pushrm
      #     docker pushrm ${{ env.IMAGE_NAME }}

  HelmDeploy:
    if: github.ref == 'refs/heads/master'
    needs: Build
    uses: byjg/byjg.github.io/.github/workflows/add-helm.yaml@master
    with:
      repo: ${{ github.event.repository.name }}
      folder: helm
      project: static-httpserver
    secrets: inherit

  Documentation:
    if: github.ref == 'refs/heads/master'
    needs: HelmDeploy
    uses: byjg/byjg.github.io/.github/workflows/add-doc.yaml@master
    with:
      folder: devops
      project: ${{ github.event.repository.name }}
    secrets: inherit
